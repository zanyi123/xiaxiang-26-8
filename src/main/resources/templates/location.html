<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title th:text="${location.name} + ' - 薪火侨乡'">地点详情</title>
    <link rel="stylesheet" href="/css/qiaoyun.css">
    <style>
        #canvas-container {
            width: 100%;
            height: 500px;
            position: relative;
            background: var(--ink-black);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }
        .model-controls {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0.5rem;
            z-index: 100;
        }
        .model-btn {
            padding: 0.5rem 1rem;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--warm-gold);
            border-radius: 6px;
            color: var(--warm-gold);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .model-btn:hover {
            background: rgba(212, 175, 55, 0.2);
        }
        .model-info {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(0, 0, 0, 0.7);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            color: var(--warm-gold);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <a href="/" class="header-logo">侨韵薪火</a>
            </div>
            <nav class="header-nav">
                <a href="/#hero">首页</a>
                <a href="/sitemap">网站导览</a>
                <a href="/#tour">云游侨乡</a>
                <a href="/#life">我的侨乡人生</a>
                <a href="/#building-story">建筑故事</a>
                <a href="/#achievement">项目成果</a>
                <a href="/about">关于我们</a>
                <a href="/admin">后台登录</a>
            </nav>
            <div class="header-right">
                <button class="header-icon-btn theme-toggle-btn" id="theme-toggle" title="切换主题" onclick="toggleTheme()">🌙</button>
                <a id="backLink" href="/map" class="back-link">← 返回地图</a>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="location-detail-page">
            <div class="location-header">
                <div class="location-number" th:text="${location.number}"></div>
                <div class="location-info">
                    <h1 class="location-name" th:text="${location.name}"></h1>
                    <p class="location-desc" th:text="${location.description}"></p>
                </div>
            </div>

            <!-- 封面大横幅（对应 IMG-02-{id}） -->
            <div class="location-cover-banner" style="position: relative; height: 260px; border-radius: 14px; overflow: hidden; margin-bottom: 1.5rem; border: 1px solid var(--glass-border); background: linear-gradient(135deg, rgba(26, 42, 74, 0.5), rgba(10, 10, 10, 0.8));">
                <img th:if="${imageUrl != null and #strings.length(imageUrl) > 0}"
                     th:src="${imageUrl}"
                     th:alt="${location.name}"
                     style="width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0;">
                <div th:unless="${imageUrl != null and #strings.length(imageUrl) > 0}"
                     class="slot-placeholder"
                     style="position: absolute; inset: 0;"
                     th:attr="data-slot-id=${'IMG-02-' + location.id}">
                    <div class="slot-type-icon">🖼️</div>
                    <div class="slot-badge" th:text="${'IMG-02-' + location.id}"></div>
                    <div class="slot-desc" th:text="${location.name} + ' · 封面图待填充'"></div>
                </div>
                <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 1.25rem; background: linear-gradient(transparent, rgba(0,0,0,0.85));">
                    <h2 style="color: var(--warm-gold); font-size: 1.3rem; margin-bottom: 0.35rem; letter-spacing: 1px;" th:text="${location.name}"></h2>
                    <p style="color: var(--text-secondary); font-size: 0.85rem; margin: 0;" th:text="${location.description}"></p>
                </div>
            </div>

            <div class="location-content">
                <div class="content-left">
                    <div id="canvas-container" style="position: relative;">
                        <div class="model-info">3D高斯泼溅模型 · 支持鼠标旋转缩放</div>
                        <canvas id="3d-canvas"></canvas>
                        <!-- 3D 模型未加载时的占位符（MDL-02-{id}） -->
                        <div id="model-placeholder"
                             class="slot-placeholder"
                             style="position: absolute; inset: 0; border-radius: 12px; display: none;"
                             th:attr="data-slot-id=${'MDL-02-' + location.id}">
                            <div class="slot-type-icon">🧊</div>
                            <div class="slot-badge" th:text="${'MDL-02-' + location.id}"></div>
                            <div class="slot-desc" th:text="${location.name} + ' · 3D模型待填充'"></div>
                            <div class="slot-status">3D 模型加载中或尚未上传</div>
                        </div>
                        <div class="model-controls">
                            <button class="model-btn" onclick="resetCamera()">重置视角</button>
                            <button class="model-btn" onclick="autoRotate()">自动旋转</button>
                            <button class="model-btn" onclick="downloadModel()">下载模型</button>
                        </div>
                    </div>
                </div>

                <div class="content-right">
                    <div class="info-card">
                        <h3 class="info-card-title">历史背景</h3>
                        <p class="info-card-content" th:text="${location.history}"></p>
                    </div>

                    <div class="info-card">
                        <h3 class="info-card-title">AI智能讲解</h3>
                        <div class="guide-text" id="guide-text" th:text="${location.audioText}"></div>
                        <div class="guide-controls">
                            <button class="guide-btn" onclick="playGuide()">
                                ▶️ 播放讲解
                            </button>
                            <button class="guide-btn" onclick="pauseGuide()">
                                ⏸️ 暂停
                            </button>
                            <button class="guide-btn" onclick="stopGuide()">
                                ⏹️ 停止
                            </button>
                        </div>
                    </div>

                    <div class="info-card">
                        <h3 class="info-card-title">全景视频</h3>
                        <!-- VID-02-{id} 有素材显示视频播放器，无素材显示Slot占位符 -->
                        <video th:if="${videoUrl != null and #strings.length(videoUrl) > 0}"
                               th:src="${videoUrl}"
                               controls
                               style="width: 100%; border-radius: 10px; background: #000;">
                        </video>
                        <div th:unless="${videoUrl != null and #strings.length(videoUrl) > 0}"
                             class="slot-placeholder"
                             style="position: relative; min-height: 160px;"
                             th:attr="data-slot-id=${'VID-02-' + location.id}">
                            <div class="slot-type-icon">🎬</div>
                            <div class="slot-badge" th:text="${'VID-02-' + location.id}"></div>
                            <div class="slot-desc" th:text="${location.name} + ' · 全景视频待填充'"></div>
                        </div>
                    </div>

                    <div class="info-card">
                        <h3 class="info-card-title">相关地点</h3>
                        <div class="related-locations">
                            <a th:each="loc : ${otherLocations}" 
                               th:href="|/location/${loc.id}|" 
                               class="related-link"
                               th:text="${loc.name}">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <button class="ai-guide-btn" id="ai-guide-btn" onclick="toggleAiGuide()">
        🎧
    </button>

    <div class="ai-guide-panel" id="ai-guide-panel">
        <h3 class="ai-guide-title">AI智能讲解</h3>
        <div class="ai-guide-text" id="ai-guide-text" th:text="${location.audioText}"></div>
        <div class="ai-guide-controls">
            <button class="ai-control-btn" onclick="playGuide()">播放</button>
            <button class="ai-control-btn" onclick="pauseGuide()">暂停</button>
            <button class="ai-control-btn" onclick="stopGuide()">停止</button>
        </div>
    </div>

    <script src="/js/building-3d.js"></script>
    <script src="/js/qiaoyun-tts.js"></script>
    <script th:inline="javascript">
        const audioText = /*[[${location.audioText}]]*/ '';

        function playGuide() {
            if (!window.QiaoyunTTS) { alert('语音功能加载失败'); return; }
            // 如果正在暂停，继续播放而不是重新开始
            if (QiaoyunTTS.isPlaying && !QiaoyunTTS.isPlaying()) {
                resumeGuide();
                return;
            }
            QiaoyunTTS.speakGuide(audioText, function() {
                // 播放完毕，恢复按钮状态
                document.getElementById('ai-guide-btn').classList.remove('playing');
                resetPauseBtn();
            });
            document.getElementById('ai-guide-btn').classList.add('playing');
        }

        function pauseGuide() {
            if (!window.QiaoyunTTS) return;
            QiaoyunTTS.pause();
            // 暂停按钮变为"继续播放"
            var btns = document.querySelectorAll('.guide-btn, .ai-control-btn');
            btns.forEach(function(b) {
                if (b.textContent.indexOf('暂停') >= 0) {
                    b.textContent = '▶️ 继续播放';
                    b.setAttribute('onclick', 'resumeGuide()');
                }
            });
        }

        function resumeGuide() {
            if (!window.QiaoyunTTS) return;
            QiaoyunTTS.resume();
            resetPauseBtn();
        }

        function resetPauseBtn() {
            var btns = document.querySelectorAll('.guide-btn, .ai-control-btn');
            btns.forEach(function(b) {
                if (b.textContent.indexOf('继续播放') >= 0) {
                    b.textContent = '⏸️ 暂停';
                    b.setAttribute('onclick', 'pauseGuide()');
                }
            });
        }

        function stopGuide() {
            if (!window.QiaoyunTTS) return;
            QiaoyunTTS.stop();
            document.getElementById('ai-guide-btn').classList.remove('playing');
            resetPauseBtn();
        }

        function toggleAiGuide() {
            const panel = document.getElementById('ai-guide-panel');
            panel.classList.toggle('active');
        }

        function resetCamera() {
            if (window.resetCamera) {
                window.resetCamera();
            }
        }

        function autoRotate() {
            if (window.toggleAutoRotate) {
                window.toggleAutoRotate();
            }
        }

        function downloadModel() {
            alert('3D模型下载功能开发中，敬请期待！');
        }

        playGuide();

        // 检测来源：如果从MBTI测试跳转，返回按钮改为"返回测试结果"
        (function() {
            var params = new URLSearchParams(window.location.search);
            if (params.get('from') === 'life') {
                var backLink = document.getElementById('backLink');
                backLink.href = '/#life';
                backLink.textContent = '← 返回测试结果';
            }
        })();
    </script>
    <footer class="footer" style="text-align: center; padding: 1.5rem; border-top: 1px solid var(--border-color, #3a3a3a); margin-top: 2rem;">
        <p style="margin-top: 0.5rem;">© 2026 侨韵薪火实践团 版权所有 · <a href="/admin/upload" style="color: var(--text-muted); font-size: 0.78rem; text-decoration: none;">管理入口</a></p>
    </footer>
    <script src="/js/slot-placeholder.js"></script>
    <script src="/js/theme-switch.js"></script>
</body>
</html>
