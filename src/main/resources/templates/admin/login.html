<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台登录 - 薪火侨乡</title>
    <link rel="stylesheet" href="/css/qiaoyun.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #2a1a1f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #e8e8e8;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(212,175,55,0.08), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(212,175,55,0.05), transparent 50%);
            pointer-events: none;
        }

        .login-card {
            position: relative;
            width: 400px;
            padding: 2.5rem 2rem;
            background: rgba(20, 20, 40, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(212,175,55,0.1);
            z-index: 1;
        }

        .logo-row {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo-badge {
            display: inline-block;
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #d4af37, #b8941f);
            border-radius: 12px;
            line-height: 52px;
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 0.75rem;
            box-shadow: 0 6px 16px rgba(212,175,55,0.3);
        }
        .logo-title {
            color: #d4af37;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin: 0;
        }
        .logo-sub {
            color: rgba(232, 232, 232, 0.55);
            font-size: 0.78rem;
            letter-spacing: 1px;
            margin-top: 0.3rem;
        }

        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: #c8b98f;
            font-size: 0.82rem;
            letter-spacing: 1px;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 0.9rem;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 10px;
            color: #e8e8e8;
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212,175,55,0.15);
        }

        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #d4af37, #b8941f);
            color: #1a1a2e;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212,175,55,0.35); }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .login-tip {
            margin-top: 1.25rem;
            padding: 0.75rem 0.9rem;
            background: rgba(212, 175, 55, 0.06);
            border-left: 3px solid rgba(212,175,55,0.5);
            border-radius: 6px;
            font-size: 0.78rem;
            color: rgba(232,232,232,0.6);
            line-height: 1.7;
        }
        .login-tip b { color: #d4af37; font-weight: 500; }

        .error-msg {
            margin-bottom: 0.75rem;
            padding: 0.5rem 0.75rem;
            background: rgba(244, 67, 54, 0.12);
            border: 1px solid rgba(244, 67, 54, 0.35);
            border-radius: 8px;
            color: #ef9a9a;
            font-size: 0.82rem;
            display: none;
        }
        .error-msg.show { display: block; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.25rem;
            color: rgba(232,232,232,0.45);
            font-size: 0.78rem;
            text-decoration: none;
        }
        .back-link:hover { color: #d4af37; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-row">
            <div class="logo-badge">🏮</div>
            <h1 class="logo-title">薪火侨乡</h1>
            <div class="logo-sub">素材管理后台 · 身份验证</div>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <form id="login-form" onsubmit="doLogin(event)">
            <div class="form-group">
                <label>账 号</label>
                <input type="text" id="username" placeholder="请输入账号" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label>密 码</label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
            </div>
            <button class="btn-login" type="submit" id="btn-login">登 录</button>
        </form>

        <div class="login-tip">
            <b>实践同学账号：</b>volunteer<br>
            <b>项目管理员：</b>admin<br>
            账号配置由相关队员管理，成员请联系队员获取账号密码
        </div>

        <a href="/" class="back-link">← 返回网站首页</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect') || '/admin/upload';

        async function doLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            const err = document.getElementById('error-msg');

            if (!username || !password) {
                showErr('请输入账号和密码');
                return;
            }

            btn.disabled = true;
            btn.textContent = '登录中...';
            err.classList.remove('show');

            const fd = new FormData();
            fd.append('username', username);
            fd.append('password', password);

            try {
                const resp = await fetch('/admin/api/login', { method: 'POST', body: fd });
                const result = await resp.json();
                if (result.success) {
                    // 登录成功跳 redirect
                    window.location.href = redirectUrl;
                } else {
                    showErr(result.message || '登录失败');
                    btn.disabled = false;
                    btn.textContent = '登 录';
                }
            } catch (err2) {
                showErr('网络错误：' + err2.message);
                btn.disabled = false;
                btn.textContent = '登 录';
            }
        }

        function showErr(msg) {
            const err = document.getElementById('error-msg');
            err.textContent = '❌ ' + msg;
            err.classList.add('show');
        }
    </script>
</body>
</html>
