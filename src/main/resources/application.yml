      material: "杉木、松木"
      era: "清末民初"
      buildingId: 1
      knowledgePoints: '[{"title":"传统木构工艺","tag":"工艺","content":"宝源坊碉楼楼板采用厚约15厘米的岭南杉木铺设，木板间以榫卯咬合，缝隙用桐油浸润防腐防蛀。这种传统工艺使楼板历经百年而不松动。","imageKey":""},{"title":"侨乡建筑规模","tag":"建筑","content":"宝源坊碉楼每层净高约3.5米，底层层高达4米，彰显了开平华侨雄厚的经济实力。楼板下常设夹层，用于存放粮食、书信、银两等贵重物品，体现了碉楼的防御性与实用性。","imageKey":""}]'
      audioText: "这是碉楼内部的木构楼板。采用岭南杉木铺设，厚约15厘米，以榫卯咬合方式连接，缝隙用桐油浸润防腐防蛀。楼板下还设有夹层，用于存放粮食、书信等贵重物品，体现了碉楼的防御性与实用性的完美结合。"

