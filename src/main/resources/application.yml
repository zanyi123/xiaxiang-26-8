    - id: 1
      title: "什么是开平碉楼？"
      category: "建筑知识"
      summary: "开平碉楼是中国乡土建筑的一个特殊类型..."
      content: ""
      difficulty: "入门"
      audioText: "开平碉楼是中国乡土建筑的一个特殊类型，是集防卫、居住和中西建筑艺术于一体的多层塔楼式建筑。它起源于明朝后期，兴盛于20世纪初，是开平华侨史和建筑史的缩影。"
    - id: 2
      title: "碉楼的建筑结构"
      category: "建筑技术"
      summary: "了解碉楼的墙体结构、楼层布局等"
      content: ""
      difficulty: "进阶"
      audioText: "碉楼的墙体多采用三合土夯筑，厚度可达60至80厘米，坚固耐久。楼层一般为3至7层，内部采用木构楼板，外墙开设碉眼用于防御和观察。"
    - id: 3
      title: "开平华侨史"
      category: "历史文化"
      summary: "了解开平华侨的发展史"
      content: ""
      difficulty: "入门"
      audioText: "开平是中国著名的华侨之乡，早在19世纪中叶，开平人就开始赴海外谋生。华侨们在海外艰苦奋斗，将积蓄汇回国内，建造碉楼和民居，形成了独特的侨乡文化。"

  cultures:
    - id: 1
      name: "开平墟日"
      category: "民俗活动"
      description: "开平传统墟日文化"
      audioText: "开平墟日是当地重要的民俗活动，每隔几日举行一次。墟日上有各种传统小吃、手工艺品出售，还有舞狮、粤剧表演，热闹非凡，是体验侨乡文化的好去处。"
    - id: 2
