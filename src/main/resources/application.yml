      function: "承载上部楼层重量"
      material: "砖石混凝土"
      era: "清末民初"
      buildingId: 1
      knowledgePoints: "[{\"title\":\"宝源坊碉楼墙体\",\"tag\":\"建筑\",\"content\":\"宝源坊现存碉楼墙体采用开平传统三合土工艺，以石灰、细沙、糯米浆分层夯筑，每层厚约30厘米。强亚村-老宅村的碉楼群中可见典型的夯筑痕迹，墙体厚度普遍达70厘米以上。\",\"imageKey\":\"\"},{\"title\":\"墙体的隔热智慧\",\"tag\":\"工艺\",\"content\":\"宝源坊碉楼厚实的墙体不仅坚固耐久，还具有天然的隔热防潮效果。即使在开平盛夏高温天气，楼内依然凉爽宜人，展现了岭南先民的建筑智慧。\",\"imageKey\":\"\"},{\"title\":\"百年岁月痕迹\",\"tag\":\"文化\",\"content\":\"宝源坊碉楼墙体历经百年风雨，表面可见自然生长的青苔与藤蔓，这些生命力顽强的植物反而加固了墙体，成为侨乡建筑与自然共生的生动写照。\",\"imageKey\":\"\"}]"
      audioText: "这是宝源坊碉楼的主体结构部分。碉楼墙体采用开平传统三合土工艺建造，以石灰、细沙、糯米浆分层夯筑而成，每层厚约30厘米。墙体厚度达70厘米以上，不仅坚固耐久，还具有天然的隔热防潮效果，使楼内冬暖夏凉。"

    - id: 2
      partName: "八角楼窗"
      partNameEn: "Octagonal Window"
      category: "装饰元素"
      description: "宝源坊碉楼顶部独特的八角形窗户，是开平碉楼的标志性设计"
      function: "通风采光、瞭望警戒"
      material: "砖石、木框"
      era: "清末民初"
      buildingId: 1
      knowledgePoints: '[{"title":"宝源坊的八角窗","tag":"建筑","content":"宝源坊碉楼顶部的八角楼窗是开平碉楼的典型特征，八角形设计兼顾了通风采光与瞭望功能，窗棂做工精细，展现了民国时期中西合璧的建筑风格。","imageKey":""},{"title":"燕子窝灰塑","tag":"文化","content":"宝源坊八角楼窗上方常见燕子窝造型的灰塑装饰，当地称燕子巢。开平华侨视其为吉祥象征，寓意燕子归巢、游子回归，寄托了海外侨胞的思乡之情。","imageKey":""}]'
      audioText: "八角楼窗是开平碉楼最具标志性的设计之一。八角形造型兼顾了通风采光与瞭望功能，窗棂做工精细。窗上方常见燕子窝造型的灰塑装饰，寓意吉祥如意、游子归巢，寄托了海外侨胞深深的思乡之情。"

    - id: 3
      partName: "碉眼与枪孔"
      partNameEn: "Arrow Slits & Gun Holes"
      category: "防御系统"
      description: "宝源坊碉楼墙体上的防御孔洞，是侨乡历史的军事见证"
      function: "防御射击、观察敌情"
      material: "砖石开口"
      era: "清末"
      buildingId: 1
      knowledgePoints: '[{"title":"碉眼的防御智慧","tag":"历史","content":"宝源坊碉楼的碉眼呈品字形排列，可从多个角度观察和射击。清末民初开平匪患频发，华侨建造碉楼时将防御功能置于首位，这些孔洞见证了侨胞守护家园的决心。","imageKey":""},{"title":"从防御到观景","tag":"文化","content":"如今宝源坊碉眼已从防御工事变为观景窗口，透过这些百年孔洞可眺望强亚村的田园风光，感受百年碉楼从军事要塞到文化遗产的历史变迁。","imageKey":""}]'
      audioText: "这些排列整齐的孔洞就是碉眼和枪孔，是碉楼防御系统的核心。呈品字形排列的碉眼可以从多个角度观察和射击，见证了当年华侨守护家园的决心。如今，这些百年孔洞已变为观景窗口，诉说着从军事要塞到文化遗产的变迁。"

    - id: 4
      partName: "灰塑装饰"
      partNameEn: "Plaster Relief Decoration"
      category: "装饰元素"
      description: "宝源坊碉楼门楣、窗楣处的灰塑浮雕装饰，岭南建筑艺术瑰宝"
