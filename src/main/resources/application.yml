      amount: "澳镑三十镑"
      content: "明德吾弟：寄上银信三十镑，专为吾弟求学之用。兄在海外深知无学之苦，望弟勤勉向学，他日成才报效家国。"
      translation: "张明远从澳大利亚寄给弟弟的劝学侨批"
      category: "教育"
