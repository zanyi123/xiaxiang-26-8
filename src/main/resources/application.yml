  knowledge:
    - id: 1
      title: "碉楼建筑风格"
      category: "建筑风格"
      summary: "开平碉楼融合中西建筑风格，是侨乡文化的独特载体"
      content: "开平碉楼的建筑风格独特，融合了中国传统建筑与西方建筑的元素。楼体一般为钢筋混凝土结构，外形多样，有中国式屋顶、西洋式立面、古罗马式柱廊等。这种中西合璧的建筑风格，反映了华侨对西方文化的接受和对传统文化的坚守。"
      difficulty: "入门"
    - id: 2
      title: "碉楼建造工艺"
      category: "建造技术"
      summary: "百年前的华侨如何建造起如此坚固的碉楼"
      content: "碉楼的建造材料主要是青砖、钢筋和混凝土。华侨从海外带回先进的建筑技术和材料，结合本地工匠的技艺，建造出了一座座坚固美观的碉楼。墙体厚度可达50厘米以上，具有很强的防御功能。"
      difficulty: "进阶"
    - id: 3
      title: "岭南建筑特色"
      category: "地域建筑"
      summary: "岭南地区独特的气候环境孕育了独特的建筑风格"
      content: "岭南建筑具有通风、遮阳、防潮、隔热等特点，适应了岭南炎热潮湿的气候。常见的元素包括：骑楼、天井、冷巷、满洲窗等。这些设计既实用又美观，体现了古人的智慧。"
      difficulty: "入门"
    - id: 4
      title: "侨批文化解读"
      category: "文化研究"
      summary: "侨批是华侨文化的重要载体，被誉为'跨海家书'"
      content: "侨批，简称'批'，是海外华侨通过民间渠道及后来的金融邮政机构寄回国内的汇款与书信的结合物。侨批不仅是汇款凭证，更是家书，承载着华侨对家人的思念和对家乡的牵挂。2013年，'侨批档案'入选《世界记忆名录》。"
      difficulty: "进阶"
    - id: 5
      title: "祠堂建筑文化"
      category: "礼制建筑"
      summary: "祠堂是宗族文化的物质载体，是族人精神家园的象征"
      content: "祠堂是中国传统社会中宗族祭祀祖先和议事的场所。岭南祠堂建筑规模宏大，装饰精美，木雕、石雕、砖雕、灰塑等工艺精湛。祠堂不仅是祭祀场所，也是宗族议事、教育子弟、举办婚丧嫁娶等大事的地方。"
      difficulty: "入门"
    - id: 6
      title: "骑楼建筑溯源"
      category: "建筑类型"
      summary: "骑楼是岭南城镇的标志性建筑，适应南方多雨炎热的气候"
      content: "骑楼是一种近代商住建筑，建筑物底层沿街面后退且留出公共人行空间。骑楼建筑起源于古希腊，后传入东南亚，再由华侨传入中国南方。骑楼既能遮阳避雨，又能使店铺门面开阔，是商业建筑的典范。"
      difficulty: "入门"

