      buildingId: 1
      knowledgePoints: '[{"title":"宝源坊灰塑工艺","tag":"工艺","content":"宝源坊碉楼的灰塑采用开平本地石灰材料，由民间老艺人手工塑造成花鸟、神兽、祥云等图案，自然风干后坚硬如石，是岭南灰塑艺术的珍贵遗存。","imageKey":""},{"title":"吉祥图案寓意","tag":"文化","content":"宝源坊碉楼灰塑图案多选用鹿（禄）、蝠（福）、鱼（余）等谐音吉祥符号，反映了华侨对美好生活的向往。部分图案融合了西方装饰元素，见证了侨乡文化的开放性。","imageKey":""}]'
      audioText: "灰塑装饰是碉楼建筑的艺术瑰宝。这些精美的浮雕采用开平本地石灰材料，由民间老艺人手工塑造而成，内容多为花鸟、神兽、祥云等吉祥图案，寄托了华侨对美好生活的向往，也是岭南灰塑艺术的珍贵遗存。"

