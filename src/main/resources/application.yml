# ============================================================
# 通用配置（提交到 Git，服务器和本地共用）
# 密钥通过环境变量注入，本地开发可使用 application-local.yml 覆盖
#
# ===== 服务器部署 =====
# export COS_SECRET_ID="你的SecretId"
# export COS_SECRET_KEY="你的SecretKey"
# java -jar xiaxiang-building-tour.jar
#
# ===== 本地开发 =====
# 1. 创建 application-local.yml（被 .gitignore 忽略，不会提交）
# 2. 启动时加参数：-Dspring.profiles.active=local
#    或在 application-local.yml 中写好密钥直接跑
# ============================================================

server:
  port: 8080

spring:
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  config:
    # 加载 jar 同级目录的 application-local.yml（服务器部署时创建在 jar 旁边）
    # 本地开发时，此文件在项目根目录（IDEA 工作目录为项目根）
    import: optional:file:./application-local.yml

# ========== 腾讯云 COS 配置 ==========
# 优先级：环境变量 > application-local.yml > 占位默认值
cos:
  secret-id: ${COS_SECRET_ID:${cos-secret-id:}}
  secret-key: ${COS_SECRET_KEY:${cos-secret-key:}}
  region: ${COS_REGION:ap-guangzhou}
  bucket-name: ${COS_BUCKET_NAME:qiaoyun-2026-gdut-100050675333-1453696876}

# ========== 应用配置 ==========
# env 可通过环境变量 APP_ENV 或启动参数 --app.env=dev/prod 覆盖
# 默认 prod（服务器安全），本地开发在 application-local.yml 中设 env: dev
app:
  mock-mode: ${APP_MOCK_MODE:false}
  env: ${APP_ENV:prod}

  buildings:
    - id: 1
      name: "开平碉楼"
      description: "世界文化遗产，融合中西建筑风格的经典之作"
    - id: 2
      name: "自力村碉楼群"
      description: "村落与碉楼和谐共生，展现侨乡独特风貌"
    - id: 3
      name: "赤坎古镇骑楼"
      description: "保存完好的骑楼建筑群，承载百年商埠记忆"

  locations:
    - id: 1
      number: "01"
      name: "宝源坊碉楼群"
      description: "三座百年碉楼，融合岭南骑楼与西洋建筑风格"
      history: "宝源坊始建于1909年，三座碉楼见证了华侨回乡建设的辉煌历史。这些碉楼融合了岭南建筑特色与西洋建筑风格，八角形窗户是其标志性特征，展现了侨乡人民对美好生活的向往和对建筑艺术的追求。"
      x-coordinate: 50
      y-coordinate: 50
      audio-text: "宝源坊始建于1909年，三座碉楼见证了华侨回乡建设的辉煌历史。这些碉楼融合了岭南建筑特色与西洋建筑风格，八角形窗户是其标志性特征。站在这里，仿佛能听到百年前工匠们叮叮当当的锤击声，感受到华侨们对故土深深的眷恋。"
    - id: 2
      number: "02"
      name: "方形古井"
      description: "百年历史，村民日常取水交流的重要场所"
      history: "这口水井已有百年历史，由青石板围砌而成。井水清澈甘甜，至今仍在使用。这里曾是村民日常取水、交流的重要场所，每一位村民都在这里留下了生活的印记。"
      x-coordinate: 30
      y-coordinate: 70
      audio-text: "这口水井已有百年历史，是村民日常取水、交流的重要场所。井水清澈甘甜，至今仍在使用。每当清晨，村里的妇女们就会来到这里打水、洗衣、聊天，这里曾是村庄最热闹的社交中心。"
    - id: 3
      number: "03"
      name: "青石板路"
      description: "鹅卵石与青石板铺就，见证侨乡岁月"
      history: "青石板路由华侨从海外带回的石材铺设，每一块都承载着乡愁。这条路上曾走过无数辛勤劳作的村民，也走过衣锦还乡的华侨，每一块石板都记录着宝源坊的变迁。"
      x-coordinate: 70
      y-coordinate: 30
      audio-text: "青石板路由华侨从海外带回的石材铺设，每一块都承载着乡愁。走在这条路上，仿佛能听到百年前村民们的脚步声，感受到时光的流转。这条路不仅是村庄的通道，更是连接过去与现在的时光隧道。"
    - id: 4
      number: "04"
      name: "古榕树群"
      description: "百年古树，遮天蔽日的村民休憩场所"
      history: "这些古榕树已有上百年树龄，枝繁叶茂，遮天蔽日。树下是村民休憩聊天的场所，也是孩子们玩耍的乐园。古树见证了村庄的兴衰变迁，是宝源坊最珍贵的自然遗产。"
      x-coordinate: 20
      y-coordinate: 30
      audio-text: "这些古榕树已有上百年树龄，遮天蔽日。树下是村民休憩聊天的场所，也是孩子们玩耍的乐园。夏天，老人们坐在树下乘凉、下棋；孩子们在树间追逐嬉戏。古树见证了一代又一代人的成长。"
    - id: 5
      number: "05"
      name: "陈氏宗祠"
      description: "宗族文化核心，雕梁画栋记录家族历史"
      history: "陈氏宗祠是宝源坊宗族文化的核心，雕梁画栋，气势恢宏。祠堂记录着陈氏家族的辉煌历史，供奉着历代祖先的牌位。每年清明，族人们都会在这里举行盛大的祭祖仪式，传承家族文化。"
      x-coordinate: 80
      y-coordinate: 60
      audio-text: "陈氏宗祠是宝源坊宗族文化的核心，雕梁画栋，记录着陈氏家族的辉煌历史。每年清明，族人们都会在这里举行祭祖仪式，缅怀祖先、传承家风。这座祠堂不仅是建筑艺术的杰作，更是家族凝聚力的象征。"
    - id: 6
      number: "06"
      name: "侨批馆"
      description: "展示华侨汇款凭证和书信往来历史"
      history: "侨批馆展示了华侨汇款凭证和书信往来历史。侨批是华侨与家乡联系的纽带，每一封侨批都饱含着对家人的思念。这里收藏的侨批记录了华侨在海外艰苦奋斗的历程，以及他们对家乡亲人深深的牵挂。"
      x-coordinate: 40
      y-coordinate: 20
      audio-text: "侨批馆展示了华侨汇款凭证和书信往来历史。侨批是华侨与家乡联系的纽带，每一封侨批都饱含着对家人的思念。透过这些泛黄的信纸，我们仿佛能看到华侨们在海外辛勤劳作的身影，感受到他们对家乡亲人深深的牵挂。"

  stories:
    - id: 1
      title: "下南洋的记忆"
      category: "口述历史"
      summary: "宝源坊的每一块青砖，都承载着华侨们漂洋过海的故事"
      content: "清朝末年，国难当头，无数开平乡亲远渡重洋，在异国他乡艰苦奋斗，又将血汗钱寄回家乡，建起了这一座座中西合璧的碉楼。当年我阿公带着五块大洋下南洋，在金山做了十年苦力，终于攒钱建起了这座楼。他说，楼建起来了，根就留住了。"
      author: "陈伯"
      date: "2024-07-15"
      views: 1256
    - id: 2
      title: "一封侨批的旅程"
      category: "侨批文化"
      summary: "每一封侨批都是一封家书，承载着海外游子对家乡的思念"
      content: "侨批，简称作'批'，是海外华侨通过民间渠道寄回国内的汇款与书信的结合物。一封侨批从海外寄到家乡，要经过水客、批局、邮局等多个环节，历时数月甚至更久。每一封侨批背后，都有一个感人的故事。"
      author: "李老师"
      date: "2024-07-16"
      views: 892
    - id: 3
      title: "碉楼里的读书声"
      category: "教育故事"
      summary: "华侨们不仅寄钱建楼，更重视家乡的教育事业"
      content: "宝源坊的碉楼里，曾走出过许多优秀的学子。华侨们深知知识改变命运的道理，他们在家乡兴办学校，设立奖学金，鼓励后辈读书上进。陈氏宗祠里的族学，曾是村里孩子们读书的地方。"
      author: "陈校长"
      date: "2024-07-17"
      views: 678
    - id: 4
      title: "古井的传说"
      category: "民间传说"
      summary: "百年古井，见证了宝源坊无数的故事与传说"
      content: "相传宝源坊的古井挖于清末，井水清澈甘甜，百年来从未干涸。老人们说，这口井连着地下河，是风水宝地。抗战时期，村民们躲在碉楼里，全靠这口井的井水才渡过难关。"
      author: "王阿婆"
      date: "2024-07-18"
      views: 1024

