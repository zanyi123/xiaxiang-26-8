      videoKey: "VID-01-01"
      audioText: "这是宝源坊内保存的碉楼建筑，融合了中西方建筑艺术风格，是开平碉楼文化的典型代表。碉楼始建于清末民初，由华侨出资建造，兼具防御和居住功能，是侨乡历史文化的活化石。"
    - id: 2
      name: "强亚村-老宅村碉楼群"
      description: "开平碉楼集中的村落，古风古色"
      videoKey: "VID-01-02"
      audioText: "强亚村和老宅村是开平碉楼最集中的村落之一，这里保存着数十座形态各异的碉楼，形成了壮观的碉楼群景观。这些碉楼见证了当年华侨回乡建楼的辉煌历史，每一座都诉说着一段跨越海洋的乡愁。"
    - id: 3
      name: "古屋内部"
      description: "探秘纪实"
      videoKey: "VID-01-03"
      audioText: "让我们走进碉楼内部，一探究竟。碉楼内部采用传统木构楼板，层高宽敞，墙体厚实坚固。在这里，你可以看到当年华侨家庭的生活场景，感受百年碉楼内的温度与故事。"

