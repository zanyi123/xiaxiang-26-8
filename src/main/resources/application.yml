  qiaopi:
    - id: 1
      title: "陈启明寄母书"
      sender: "陈启明"
      recipient: "母亲大人"
      send-from: "美国旧金山"
      year: "1923"
      amount: "美元五十元"
      content: "母亲大人膝下：儿在金山一切安好，附上银信五十元，望用于家中修缮碉楼。儿日夜思念家乡，待积攒银两便归。"
      translation: "这是陈启明从美国旧金山寄给母亲的家书兼汇款，提到修缮碉楼事宜"
      category: "家书"
    - id: 2
      title: "李金福致妻书"
      sender: "李金福"
      recipient: "妻子王氏"
      send-from: "加拿大温哥华"
      year: "1928"
      amount: "美元八十元"
      content: "贤妻如晤：附上银信八十元，为子女束脩及家用。望勤俭持家，教导孩儿读书上进，勿念为盼。"
      translation: "李金福从加拿大寄给妻子的侨批，强调子女教育"
      category: "家书"
    - id: 3
      title: "黄氏家族侨批"
