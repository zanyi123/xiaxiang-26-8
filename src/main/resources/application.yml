# ============================================================
# 通用配置（提交到 Git，服务器和本地共用）
#
# ===== 服务器部署（prod 环境） =====
# java -jar xiaxiang-building-tour-1.0-SNAPSHOT.jar
#   默认 prod 环境，密钥通过环境变量或 ./application-local.yml 注入
#
# ===== 本地开发（dev 环境） =====
# IDEA 运行时工作目录为项目根，加载根目录的 application-local.yml
#   application-local.yml 中设置 spring.profiles.active: dev 和密钥
# ============================================================

server:
  port: 8080

spring:
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  web:
    resources:
      cache:
        period: 0
      add-mappings: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  config:
    import: optional:file:./application-local.yml

# ========== 腾讯云 COS 配置 ==========
cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  region: ap-guangzhou
  bucket-name: qiaoyun-2026-gdut-100050675333-1453696876

# ========== 日志级别配置 ==========
# 抑制 COS SDK 对 404（文件不存在）的 ERROR 日志，这些是预期行为
# COS SDK 在 doesObjectExist 返回 404 时会内部打印 ERROR 日志后才抛异常，应用层无法拦截
# 设置为 OFF 完全关闭 COS SDK 日志输出，业务层异常处理已足够
logging:
  level:
    com.qcloud.cos: OFF
    org.example.xiaxiang: INFO

