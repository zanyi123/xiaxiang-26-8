      content: "族长大人台鉴：附上叻币一百二十元，作为宗祠修缮之资。愿先祖保佑族运昌隆，子孙繁盛。"
      translation: "黄亚福从马来西亚汇款修缮宗祠的侨批"
      category: "宗族"
    - id: 4
